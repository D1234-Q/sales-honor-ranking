rgin:0 0 12px;letter-spacing:.08em}.progress{height:8px;background:#1b2942;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;width:74%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 14px rgba(112,215,255,.5)}.season-meta{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:11px}.season-meta b{color:var(--text)}.foot{display:flex;justify-content:space-between;margin-top:15px;color:#5f718f;font-size:10px;letter-spacing:.05em}.rank-row.enter{animation:rowIn .65s ease both}.upgrade-toast{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,7,14,.86);backdrop-filter:blur(8px);opacity:0;pointer-events:none;z-index:4;transition:opacity .35s}.upgrade-toast.show{opacity:1}.upgrade-card{padding:36px 70px;text-align:center;border:1px solid rgba(245,185,66,.72);border-radius:24px;background:radial-gradient(circle at 50% 0%,rgba(245,185,66,.28),transparent 53%),#111b2d;box-shadow:0 0 80px rgba(245,185,66,.18)}.upgrade-card .mini{font-size:13px;color:var(--muted);letter-spacing:.25em}.upgrade-card h2{margin:14px 0 5px;color:var(--gold);font-size:38px;letter-spacing:.15em}.upgrade-card p{margin:0;color:var(--text);font-size:18px}.stars{color:var(--gold);font-size:28px;letter-spacing:16px;margin-bottom:12px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@keyframes crownGlow{0%,100%{box-shadow:0 0 0 5px rgba(245,185,66,.08),0 0 20px rgba(245,185,66,.25)}50%{box-shadow:0 0 0 8px rgba(245,185,66,.08),0 0 30px rgba(245,185,66,.5)}}@keyframes pulse{50%{opacity:.42;transform:scale(.8)}}@keyframes rowIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:1200px){.page{padding:20px}.title-block{transform:none}.layout{grid-template-columns:1fr}.side-stack{display:grid;grid-template-columns:1fr 1fr}.rank-row{grid-template-columns:38px 34px minmax(130px,1fr) 100px 65px 105px 100px}.team-panel{min-height:0}}@media(max-width:780px){.page{padding:15px}.topbar{height:auto;gap:15px;padding-bottom:15px;align-items:flex-start}.title-block{order:-1;text-align:left}.title-block h1{font-size:23px;letter-spacing:.09em}.brand{display:none}.clock{min-width:auto}.clock-time{font-size:18px}.honors{grid-template-columns:1fr}.honor{min-height:85px}.podium{gap:6px}.podium-card{padding:12px 5px;min-height:160px}.podium-card.first{min-height:180px}.podium-name{font-size:15px}.podium-avatar{width:44px;height:44px}.first .podium-avatar{width:53px;height:53px}.rank-score{font-size:16px}.rank-list{gap:6px}.rank-row{grid-template-columns:30px 30px minmax(105px,1fr) 65px 68px;padding:7px 8px;gap:6px}.rank-row .badge{display:none}.rank-row .row-stat:nth-of-type(2){display:none}.rank-row .gap{display:none}.side-stack{grid-template-columns:1fr}.foot{font-size:9px}}

<body>
  <main class="page"><div class="shell">
    <header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true"></div><div class="brand-copy">远见地产<span>VISION SALES CLUB</span></div></div><div class="title-block"><h1>销售荣耀排行榜</h1><p>2026 年 9 月赛季 · THE RANKED SEASON</p></div><div class="clock"><div class="clock-time" id="clockTime">--:--:--</div><div class="clock-date" id="clockDate">2026年9月17日 星期四</div><div class="season-left"><i class="live-dot"></i><span>本赛季还剩 <b id="daysLeft">13</b> 天</span></div></div></header>
    <section class="honors" id="honors" aria-label="本月核心荣誉"></section>
    <div class="layout"><section class="rank-panel"><div class="section-heading"><div class="section-title">竞技排行榜<small>个人赛季积分 · 结果决定段位</small></div><div class="heading-note">实时更新 · <b id="rankCount">18</b> 位勇士正在排位</div></div><div class="podium" id="podium"></div><div class="rank-list" id="rankList"></div><div class="foot"><span>积分规则：收客 +1 · 带看 +10 · 成交 +100 · 业绩每万元 +10</span><span>最后同步：刚刚</span></div></section><aside class="side-stack"><section class="team-panel side-card"><div class="section-heading"><div class="section-title">战队排行榜<small>小组总积分 · 并肩作战</small></div></div><div id="teamList"></div></section><section class="team-panel season-card"><h3>赛季进度 · SEPTEMBER</h3><div class="progress"><span></span></div><div class="season-meta"><span>赛季已进行 <b>17</b> 天</span><span>剩余 <b id="daysLeft2">13</b> 天</span></div></section></aside></div>
  </div></main><div class="upgrade-toast" id="upgradeToast"><div class="upgrade-card"><div class="stars">✦ ✦ ✦</div><div class="mini">RANK PROMOTION</div><h2 id="upgradeName">邱锋</h2><p>恭喜晋升 <b id="upgradeRank">王者</b>！</p></div></div>
  <script>
    // ==================== 可替换数据层 ====================
    const SCORING = { customer: 1, viewing: 10, deal: 100, performancePerWan: 10, sharedAssist: 30 };
    const TIERS = [
      { name:'青铜', min:0, max:199, cls:'bronze', next:'白银' }, { name:'白银', min:200, max:399, cls:'silver', next:'黄金' },
      { name:'黄金', min:400, max:699, cls:'gold', next:'铂金' }, { name:'铂金', min:700, max:999, cls:'platinum', next:'钻石' },
      { name:'钻石', min:1000, max:1499, cls:'diamond', next:'王者' }, { name:'王者', min:1500, max:1999, cls:'king', next:'荣耀王者' },
      { name:'荣耀王者', min:2000, max:Infinity, cls:'honor', next:null }
    ];
    const EMPLOYEES = [
      {name:'邱锋',group:'7组',customers:55,viewings:12,deals:[2100000,500000],assist:1,avatar:'邱'}, {name:'林悦',group:'3组',customers:48,viewings:15,deals:[1000000,400000],assist:2,avatar:'林'},
      {name:'陈默',group:'5组',customers:61,viewings:14,deals:[1000000],assist:1,avatar:'陈'}, {name:'张骁',group:'3组',customers:42,viewings:11,deals:[800000],assist:0,avatar:'张'},
      {name:'苏芮',group:'7组',customers:46,viewings:13,deals:[350000],assist:2,avatar:'苏'}, {name:'周扬',group:'2组',customers:39,viewings:10,deals:[280000],assist:1,avatar:'周'},
      {name:'赵一鸣',group:'5组',customers:35,viewings:9,deals:[240000],assist:0,avatar:'赵'}, {name:'何婉',group:'1组',customers:31,viewings:8,deals:[180000],assist:2,avatar:'何'},
      {name:'高远',group:'4组',customers:38,viewings:7,deals:[150000],assist:1,avatar:'高'}, {name:'罗成',group:'2组',customers:27,viewings:6,deals:[120000],assist:0,avatar:'罗'},
      {name:'唐宁',group:'6组',customers:29,viewings:6,deals:[100000],assist:1,avatar:'唐'}, {name:'许诺',group:'1组',customers:32,viewings:5,deals:[80000],assist:0,avatar:'许'},
      {name:'沈妍',group:'4组',customers:24,viewings:5,deals:[],assist:3,avatar:'沈'}, {name:'李昊',group:'6组',customers:21,viewings:4,deals:[],assist:0,avatar:'李'},
      {name:'魏然',group:'2组',customers:18,viewings:3,deals:[],assist:1,avatar:'魏'}, {name:'顾南',group:'1组',customers:12,viewings:2,deals:[],assist:0,avatar:'顾'},
      {name:'叶青',group:'5组',customers:9,viewings:1,deals:[],assist:0,avatar:'叶'}, {name:'梁辰',group:'6组',customers:5,viewings:0,deals:[],assist:0,avatar:'梁'}
    ];
    function scoreOf(e){ return e.customers*SCORING.customer + e.viewings*SCORING.viewing + e.deals.length*SCORING.deal + e.deals.reduce((a,v)=>a+v/10000*SCORING.performancePerWan,0) + e.assist*SCORING.sharedAssist; }
    function tierOf(score){ return [...TIERS].reverse().find(t=>score>=t.min); }
    function enrich(data){ return data.map(e=>{const score=Math.round(scoreOf(e));const tier=tierOf(score);return {...e,score,tier,performance:e.deals.reduce((a,v)=>a+v,0)};}).sort((a,b)=>b.score-a.score); }
    const tierBadge=e=>`<span class="badge badge-${e.tier.cls}"><i class="badge-dot"></i>${e.tier.name}</span>`;
    const avatar=e=>`<div class="avatar">${e.avatar}</div>`;
    function formatWan(v){return v?`${(v/10000).toFixed(v%10000?1:0)}万`:'0万'}
    function gapToTier(e){return e.tier.next?`距${e.tier.next}还差 <strong>${e.tier.min + (TIERS.find(t=>t.name===e.tier.next)?.min-e.tier.min) - e.score} 分</strong>`:'已达最高段位';}
    let rankings=enrich(EMPLOYEES);
    function render(){
      const [first,second,third]=rankings; document.getElementById('rankCount').textContent=rankings.length;
      document.getElementById('podium').innerHTML=[second,first,third].map((e,i)=>`<article class="podium-card ${e===first?'first':i===0?'second':'third'}"><div class="place"><strong>${e===first?'♛':i===0?'02':'03'}</strong>${e===first?'CHAMPION':'RANK'}</div>${avatar(e).replace('class="avatar"','class="avatar podium-avatar"')}<div class="podium-name">${e.name}</div><div class="podium-group">${e.group} · ${e.tier.name}</div><div class="rank-score">${e.score}<span class="score-unit"> 分</span></div>${tierBadge(e)}</article>`).join('');
      document.getElementById('rankList').innerHTML=rankings.slice(3,10).map((e,i)=>{const prev=rankings[i+2];return `<div class="rank-row enter" style="animation-delay:${i*60}ms"><div class="rank-no">${i+4}</div>${avatar(e)}<div><div class="person-name">${e.name}</div><div class="person-meta">${e.group} · 本月 ${e.deals.length} 单</div></div>${tierBadge(e)}<div class="row-stat"><small>积分</small>${e.score}</div><div class="row-stat"><small>业绩</small>${formatWan(e.performance)}</div><div class="gap"><small>距第${i+3}名</small><strong>${prev.score-e.score} 分</strong></div></div>`}).join('');
      const groups={};rankings.forEach(e=>{groups[e.group]=(groups[e.group]||0)+e.score});const teams=Object.entries(groups).sort((a,b)=>b[1]-a[1]);document.getElementById('teamList').innerHTML=teams.slice(0,5).map((t,i)=>`<div class="team-row"><div class="team-no">${i+1}</div><div><div class="team-name">${t[0]}</div><div class="team-delta">${i?`距上一名 ${teams[i-1][1]-t[1]} 分`:'当前领跑战队'}</div></div><div class="team-score">${t[1]}<small>积分</small></div></div>`).join('');
      const highest=[...rankings].sort((a,b)=>b.performance-a.performance)[0], viewing=[...rankings].sort((a,b)=>b.viewings-a.viewings)[0], fastest=[...rankings].sort((a,b)=>(b.viewings*3+b.deals.length*24+b.customers*.4)-(a.viewings*3+a.deals.length*24+a.customers*.4))[0];
      document.getElementById('honors').innerHTML=`<article class="honor crown"><div class="honor-label"><b>♛ 本月销冠</b> · PERFORMANCE</div><div class="honor-content">${avatar(highest)}<div><div class="honor-name">${highest.name} <span class="honor-stat">${highest.group}</span></div><div class="honor-stat">本月业绩 <strong>${formatWan(highest.performance)}</strong> · ${highest.score} 分</div></div></div></article><article class="honor"><div class="honor-label"><b>◈ 带看王</b> · VIEWINGS</div><div class="honor-content">${avatar(viewing)}<div><div class="honor-name">${viewing.name} <span class="honor-stat">${viewing.group}</span></div><div class="honor-stat">有效带看 <strong>${viewing.viewings} 组</strong> · 持续领跑</div></div></div></article><article class="honor"><div class="honor-label"><b>↗ 冲刺王</b> · MOMENTUM</div><div class="honor-content">${avatar(fastest)}<div><div class="honor-name">${fastest.name} <span class="honor-stat">${fastest.group}</span></div><div class="honor-stat">本月增长 <strong>+${Math.round(fastest.score*.42)} 分</strong> · 火力全开</div></div></div></article>`;
    }
    function tick(){const now=new Date();document.getElementById('clockTime').textContent=now.toLocaleTimeString('zh-CN',{hour12:false});document.getElementById('clockDate').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});const left=Math.max(0,30-now.getDate());document.getElementById('daysLeft').textContent=left;document.getElementById('daysLeft2').textContent=left;}
    render();tick();setInterval(tick,1000);
    // 为后续 API 接入预留：将这里的 EMPLOYEES 替换为 fetch('/api/rankings') 返回的数据即可。
    setInterval(()=>{const e=rankings[0];document.getElementById('upgradeName').textContent=e.name;document.getElementById('upgradeRank').textContent=e.tier.name;document.getElementById('upgradeToast').classList.add('show');setTimeout(()=>document.getElementById('upgradeToast').classList.remove('show'),2600)},30000);
